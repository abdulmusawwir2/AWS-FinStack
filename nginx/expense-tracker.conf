# expense-tracker.conf
# Nginx reverse proxy configuration for Expense Tracker
#
# This config:
#   - Listens on port 80 (HTTP)
#   - Forwards all requests to Gunicorn on port 5000
#   - Serves static files directly (faster than going through Flask)
#   - Adds security headers
#   - Compresses responses with gzip
#
# INSTALLATION (on Ubuntu EC2):
#   1. Copy to Nginx sites-available:
#      sudo cp nginx/expense-tracker.conf /etc/nginx/sites-available/expense-tracker
#
#   2. Enable the site:
#      sudo ln -s /etc/nginx/sites-available/expense-tracker \
#                 /etc/nginx/sites-enabled/expense-tracker
#
#   3. Remove default config (optional):
#      sudo rm /etc/nginx/sites-enabled/default
#
#   4. Test Nginx config:
#      sudo nginx -t
#
#   5. Reload Nginx:
#      sudo systemctl reload nginx

server {
    listen 80;
    # Replace with your EC2 public IP or domain name
    server_name _;

    # ── Static Files ─────────────────────────────────────────────
    # Nginx serves these directly — faster than going through Flask
    location /static/ {
        alias /home/ubuntu/expense-tracker/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ── Proxy to Gunicorn ─────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Pass real client info to Flask
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts (increase for slow DynamoDB calls)
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ── Security Headers ──────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header X-XSS-Protection       "1; mode=block" always;

    # ── Gzip Compression ──────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1024;

    # ── Logging ───────────────────────────────────────────────────
    access_log /var/log/nginx/expense-tracker-access.log;
    error_log  /var/log/nginx/expense-tracker-error.log;
}
