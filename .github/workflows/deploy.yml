# ============================================================
# .github/workflows/deploy.yml
# GitHub Actions CI/CD Pipeline — Expense Tracker
#
# WHAT THIS DOES:
#   Every time you push to the 'main' branch:
#     1. Runs tests / syntax check
#     2. SSHes into your EC2 instance
#     3. Pulls the latest code
#     4. Installs any new dependencies
#     5. Restarts the Gunicorn service
#     → Your live site updates automatically!
#
# REQUIRED GITHUB SECRETS (Settings → Secrets → Actions):
#   EC2_HOST        → Your EC2 public IP or domain (e.g. 54.123.45.67)
#   EC2_USERNAME    → EC2 login user (usually: ubuntu)
#   EC2_SSH_KEY     → Contents of your .pem private key file
#
# HOW TO ADD SECRETS:
#   GitHub repo → Settings → Secrets and variables → Actions → New secret
# ============================================================

name: 🚀 Deploy to EC2

on:
  push:
    branches:
      - main          # Triggers on every push to main
  workflow_dispatch:  # Also allows manual trigger from GitHub UI

jobs:

  # ────────────────────────────────────────────────────────────
  # JOB 1: Lint & Syntax Check (runs in GitHub's cloud)
  # ────────────────────────────────────────────────────────────
  test:
    name: ✅ Lint & Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Python syntax (all .py files)
        run: |
          echo "Checking Python syntax..."
          find . -name "*.py" -not -path "./venv/*" | while read file; do
            python -m py_compile "$file" && echo "  ✅ $file" || echo "  ❌ $file"
          done
          echo "Syntax check complete."

      - name: Verify app imports correctly
        run: |
          python -c "import app; print('✅ app.py imports successfully')"
        env:
          # Dummy values just for import check (no real AWS calls made)
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
          AWS_REGION: us-east-1
          DYNAMODB_TABLE_NAME: ExpenseTracker
          FLASK_SECRET_KEY: ci-test-secret
          LOGIN_USERNAME: admin
          LOGIN_PASSWORD: admin123

  # ────────────────────────────────────────────────────────────
  # JOB 2: Deploy to EC2 (only runs if Job 1 passes)
  # ────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to EC2
    runs-on: ubuntu-latest
    needs: test          # Only deploy if lint/test job passed
    if: github.ref == 'refs/heads/main'   # Only deploy from main branch

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── SSH into EC2 and run deployment commands ──────────────
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 120s
          script: |
            set -e   # Exit immediately if any command fails

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  🚀 Expense Tracker — Deployment Started"
            echo "  📅 $(date '+%Y-%m-%d %H:%M:%S IST')"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            # ── Step 1: Navigate to project directory ──────────
            echo ""
            echo "[1/5] Navigating to project directory..."
            cd /home/ubuntu/expense-tracker

            # ── Step 2: Pull latest code from GitHub ───────────
            echo ""
            echo "[2/5] Pulling latest code from GitHub..."
            git fetch origin main
            git reset --hard origin/main
            echo "      ✅ Code updated to: $(git log -1 --format='%h — %s')"

            # ── Step 3: Activate virtual environment ───────────
            echo ""
            echo "[3/5] Activating virtual environment..."
            source venv/bin/activate

            # ── Step 4: Install / update dependencies ──────────
            echo ""
            echo "[4/5] Installing dependencies..."
            pip install -r requirements.txt --quiet
            echo "      ✅ Dependencies up to date."

            # ── Step 5: Restart Gunicorn service ───────────────
            echo ""
            echo "[5/5] Restarting Gunicorn service..."
            sudo systemctl restart expense-tracker
            sleep 3   # Wait a moment for service to start

            # ── Verify service is running ───────────────────────
            STATUS=$(sudo systemctl is-active expense-tracker)
            if [ "$STATUS" = "active" ]; then
              echo "      ✅ Service is ACTIVE and running!"
            else
              echo "      ❌ Service failed to start! Checking logs..."
              sudo journalctl -u expense-tracker -n 30 --no-pager
              exit 1
            fi

            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  ✅ DEPLOYMENT COMPLETE!"
            echo "  🌐 Site: http://${{ secrets.EC2_HOST }}"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # ── Post-deployment health check ──────────────────────────
      - name: 🏥 Health Check
        run: |
          echo "Running health check..."
          sleep 5   # Give the server a moment to fully start
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            http://${{ secrets.EC2_HOST }}/api/health --max-time 15 || echo "000")
          echo "Health check HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Health check PASSED — app is live!"
          else
            echo "⚠️  Health check returned $HTTP_STATUS (app may still be starting)"
          fi
